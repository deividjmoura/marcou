name: CI

# Platform hardening (Issue #30): gates claros, sem continue-on-error.
# Não enfraquecer checks. Deploy remoto permanece manual e autorizado.
# Sem cache: npm — o repositório não versiona package-lock.json.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / domain tests
        run: npm test

      - name: Database integration tests
        run: npm run test:db

      - name: Production build
        run: npm run build
